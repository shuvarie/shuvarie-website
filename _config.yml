# Site settings
title: Shuvarie
email: shuvarie-org@pm.me
description: >- # this means to ignore newlines until "baseurl:"
  Shuvarie (シュヴァリエ) is an AI coding agent living in the terminal —
  agentic coding with sessions, skills, themes, and strict permissions,
  built for chivalrous people.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://shuvarie.org" # the base hostname & protocol for your site, e.g. http://example.com
# NOTE: No X (Twitter) account for Shuvarie due to regional restriction.
github_username:  shuvarie

# Build settings
theme: just-the-docs
plugins:
  - jekyll-feed

# just-the-docs theme settings
# https://just-the-docs.com/docs/configuration/
just_the_docs:
  color_scheme: dark

search_enabled:
  enabled: true
  button: true

heading_anchors: 2

aux_links:
  "Shuvarie on GitHub":
    - "https://github.com/shuvarie/shuvarie"

nav_external_links:
  - title: "GitHub repository"
    url: "https://github.com/shuvarie/shuvarie"
    hide_icon: false

footer_content: >-
  Copyright &copy; 2025 Shuvarie. Distributed by an
  <a href="https://github.com/shuvarie/shuvarie/blob/main/LICENSE">MIT license</a>.

# Exclude from processing.
exclude:
  - vendor/
  - Gemfile
  - Gemfile.lock
  - ref/
  - LICENSE
  - AGENTS.md
  - shuvarie.kdl
